name: APK derle ve yayınla

# main'e her push'ta APK derlenir, Release'e yüklenir; uygulamadaki "Güncelle" bunu indirir.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 secret'ı yok. Repo > Settings > Secrets and variables > Actions'a ekle."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Derle
        run: gradle --no-daemon :app:assembleDebug

      - name: Yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk AW1KPanel.apk
          sha256sum AW1KPanel.apk | cut -d' ' -f1 > AW1KPanel.apk.sha256
          NOTES="Otomatik derleme: $(git log -1 --pretty=%s)"
          if gh release view "$VER" >/dev/null 2>&1; then
            gh release upload "$VER" AW1KPanel.apk AW1KPanel.apk.sha256 --clobber
            gh release edit "$VER" --notes "$NOTES" --latest
          else
            gh release create "$VER" AW1KPanel.apk AW1KPanel.apk.sha256 --title "v$VER" --notes "$NOTES" --latest
          fi
